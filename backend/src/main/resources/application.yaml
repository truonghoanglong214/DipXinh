
spring:
  application:
    name: dipxinh-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dipxinh}
    username: ${DB_USERNAME:dipxinh_app}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
